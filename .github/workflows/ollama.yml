name: Build ollama

on:
  push:
    paths:
      - 'ollama/**'
      - '.github/workflows/ollama.yml'
      - '.github/workflows/build-multiarch.yml'
  schedule:
    - cron: '0 4 * * 1'   # wöchentlich montags 04:00 UTC
  workflow_dispatch:
    inputs:
      arm64_runner:
        description: 'Wo arm64 gebaut wird'
        type: choice
        default: github
        options:
          - github        # Standard für ollama (siehe unten)
          - auto          # eigener RK3588-Runner, falls online – sonst GitHub
          - self-hosted   # erzwingen: eigener Runner

# Node.js 24 opt-in (Pflicht ab 02.06.2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Sicherheit: arm64 baut auf dem eigenen, privilegierten RK3588-Runner.
# NIEMALS einen pull_request-Trigger hinzufügen (öffentliches Repo).

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Digest von ollama/ollama prüfen
  # ──────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      current_digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Digest von Docker Hub holen (ollama/ollama)
        id: digest
        run: |
          TOKEN=$(curl -s \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ollama/ollama:pull" \
            | jq -r .token)

          DIGEST=$(curl -sI \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            https://registry-1.docker.io/v2/ollama/ollama/manifests/latest \
            | grep -i "docker-content-digest" \
            | awk '{print $2}' \
            | tr -d '\r')

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Aktueller Digest: $DIGEST"

      - name: Vergleich mit gespeichertem Digest
        id: compare
        run: |
          STORED="${{ vars.OLLAMA_IMAGE_DIGEST }}"
          CURRENT="${{ steps.digest.outputs.digest }}"

          echo "Gespeichert : $STORED"
          echo "Aktuell     : $CURRENT"

          if [ "$STORED" != "$CURRENT" ]; then
            echo "→ Update erkannt, Build wird gestartet"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "→ Kein Update, Build wird übersprungen"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────
  # JOB 2: Multiarch-Image bauen (siehe build-multiarch.yml)
  #         Läuft wenn:
  #           - Basis/Version hat sich geändert (schedule)
  #           - Dateien wurden geändert (push)
  #           - Manuell ausgelöst (workflow_dispatch)
  # ──────────────────────────────────────────────
  build:
    needs: check
    if: >
      needs.check.outputs.needs_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image: ghcr.io/daywalker91/ollama
      context: ./ollama
      armv7: false
      # Standard GitHub statt eigener Runner: Das Dockerfile kompiliert nichts
      # (nur FROM ollama/ollama + COPY), nativ bringt also keinen Gewinn – aber
      # das 2,65 GB große Basis-Image würde auf dem Knoten entpackt; der Job
      # wurde dabei am 2026-10-01 mit Exit 143 (SIGTERM) abgebrochen.
      arm64_runner: ${{ inputs.arm64_runner || 'github' }}
    secrets: inherit

  # ──────────────────────────────────────────────
  # JOB 3: Gespeicherte Werte aktualisieren (erst nach erfolgreichem Build)
  # ──────────────────────────────────────────────
  variables:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Digest in GitHub Variable speichern
        run: |
          DIGEST="${{ needs.check.outputs.current_digest }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/OLLAMA_IMAGE_DIGEST" \
            -d "{\"name\":\"OLLAMA_IMAGE_DIGEST\",\"value\":\"${DIGEST}\"}")
          if [ "$STATUS" = "404" ]; then
            echo "Variable existiert noch nicht – wird erstellt..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
              -d "{\"name\":\"OLLAMA_IMAGE_DIGEST\",\"value\":\"${DIGEST}\"}"
          else
            echo "Variable aktualisiert (HTTP $STATUS)"
          fi

