name: Build rk-llama

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rk-llama/**'

jobs:
  check:
    name: Prüfe auf neue rk-llama.cpp Version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      latest_commit: ${{ steps.get_commit.outputs.commit }}
    steps:
      - name: Neuesten Commit von rknpu2 Branch holen
        id: get_commit
        run: |
          COMMIT=$(curl -s "https://api.github.com/repos/invisiofficial/rk-llama.cpp/commits/rknpu2" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | jq -r '.sha[:8]')
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "Aktueller Commit: ${COMMIT}"

      - name: Vergleich mit gespeichertem Commit
        id: compare
        run: |
          STORED="${{ vars.RK_LLAMA_COMMIT }}"
          LATEST="${{ steps.get_commit.outputs.commit }}"
          if [ "${STORED}" != "${LATEST}" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Neuer Commit gefunden: ${LATEST} (gespeichert: ${STORED})"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Kein neuer Commit. Build wird übersprungen."
          fi

  build:
    name: Build & Push (arm64 only)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU einrichten (für arm64-Build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Login bei ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: ./rk-llama
          file: ./rk-llama/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/daywalker91/rk-llama:latest
            ghcr.io/daywalker91/rk-llama:${{ needs.check.outputs.latest_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Variablen aktualisieren
        if: needs.check.outputs.should_build == 'true'
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/RK_LLAMA_COMMIT" \
            -d "{\"name\":\"RK_LLAMA_COMMIT\",\"value\":\"${{ needs.check.outputs.latest_commit }}\"}"
