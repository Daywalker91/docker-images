name: Build rkllm

on:
  push:
    paths:
      - 'rkllm/**'
  schedule:
    - cron: '0 4 * * 1'   # wöchentlich montags 04:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'rknn-llm Version zum Testen (z.B. v1.2.1). Leer lassen für automatische neueste Version.'
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Neueste rknn-llm Version prüfen
  # ──────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      current_version: ${{ steps.final.outputs.version }}
      is_manual_test: ${{ steps.final.outputs.is_manual_test }}

    steps:
      - name: Neueste rknn-llm Version holen (GitHub API)
        id: version
        run: |
          VERSION=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/airockchip/rknn-llm/releases/latest \
            | jq -r .tag_name)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Aktuelle rknn-llm Version: $VERSION"

      - name: Manuellen Versions-Override anwenden (falls gesetzt)
        id: final
        run: |
          MANUAL_VERSION="${{ inputs.version }}"
          AUTO_VERSION="${{ steps.version.outputs.version }}"

          if [ -n "$MANUAL_VERSION" ]; then
            echo "→ Manueller Test mit Version: $MANUAL_VERSION (wird NICHT als RKLLM_VERSION gespeichert)"
            echo "version=$MANUAL_VERSION" >> $GITHUB_OUTPUT
            echo "is_manual_test=true" >> $GITHUB_OUTPUT
          else
            echo "version=$AUTO_VERSION" >> $GITHUB_OUTPUT
            echo "is_manual_test=false" >> $GITHUB_OUTPUT
          fi

      - name: Vergleich mit gespeicherter Version
        id: compare
        run: |
          STORED="${{ vars.RKLLM_VERSION }}"
          CURRENT="${{ steps.version.outputs.version }}"

          echo "Gespeichert : $STORED"
          echo "Aktuell     : $CURRENT"

          if [ "$STORED" != "$CURRENT" ]; then
            echo "→ Update erkannt, Build wird gestartet"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "→ Kein Update, Build wird übersprungen"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────
  # JOB 2: nativ auf RK3588 Self-Hosted Runner bauen und auf ghcr.io pushen
  #         Kein QEMU mehr nötig – nerdctl baut direkt nativ arm64.
  # ──────────────────────────────────────────────
  build:
    name: Build & Push (nativ ARM64 auf RK3588)
    needs: check
    if: >
      needs.check.outputs.needs_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, arm64, rk3588]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login bei ghcr.io
        run: |
          echo "${{ secrets.GH_PAT }}" | \
          nerdctl --address /run/k3s/containerd/containerd.sock \
            login ghcr.io -u Daywalker91 --password-stdin

      - name: Build & Push (nativ arm64)
        run: |
          VERSION="${{ needs.check.outputs.current_version }}"
          IS_MANUAL="${{ needs.check.outputs.is_manual_test }}"

          TAGS="-t ghcr.io/daywalker91/rkllm:${{ github.sha }}"
          if [ "$IS_MANUAL" = "true" ]; then
            # Manueller Versionstest: eigenes Tag, "latest" bleibt unberührt
            TAGS="$TAGS -t ghcr.io/daywalker91/rkllm:test-${VERSION}"
          else
            TAGS="$TAGS -t ghcr.io/daywalker91/rkllm:latest"
          fi

          nerdctl --address /run/k3s/containerd/containerd.sock \
            build \
            --build-arg RKLLM_VERSION=${VERSION} \
            $TAGS \
            ./rkllm

          if [ "$IS_MANUAL" = "true" ]; then
            nerdctl --address /run/k3s/containerd/containerd.sock \
              push ghcr.io/daywalker91/rkllm:test-${VERSION}
          else
            nerdctl --address /run/k3s/containerd/containerd.sock \
              push ghcr.io/daywalker91/rkllm:latest
          fi
          nerdctl --address /run/k3s/containerd/containerd.sock \
            push ghcr.io/daywalker91/rkllm:${{ github.sha }}

      - name: Version in GitHub Variable speichern
        if: needs.check.outputs.is_manual_test != 'true'
        run: |
          VERSION="${{ needs.check.outputs.current_version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/RKLLM_VERSION" \
            -d "{\"name\":\"RKLLM_VERSION\",\"value\":\"${VERSION}\"}")
          if [ "$STATUS" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
              -d "{\"name\":\"RKLLM_VERSION\",\"value\":\"${VERSION}\"}"
          else
            echo "Variable aktualisiert (HTTP $STATUS)"
          fi
