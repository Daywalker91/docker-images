name: Build rkllm

on:
  push:
    paths:
      - 'rkllm/**'
  schedule:
    - cron: '0 4 * * 1'   # wöchentlich montags 04:00 UTC
  workflow_dispatch:

# Node.js 24 opt-in (Pflicht ab 02.06.2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Neueste rknn-llm Version prüfen
  # ──────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      current_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Neueste rknn-llm Version holen (GitHub API)
        id: version
        run: |
          VERSION=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/airockchip/rknn-llm/releases/latest \
            | jq -r .tag_name)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Aktuelle rknn-llm Version: $VERSION"

      - name: Vergleich mit gespeicherter Version
        id: compare
        run: |
          STORED="${{ vars.RKLLM_VERSION }}"
          CURRENT="${{ steps.version.outputs.version }}"

          echo "Gespeichert : $STORED"
          echo "Aktuell     : $CURRENT"

          if [ "$STORED" != "$CURRENT" ]; then
            echo "→ Update erkannt, Build wird gestartet"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "→ Kein Update, Build wird übersprungen"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────
  # JOB 2: arm64 Image bauen und auf ghcr.io pushen
  #         Nur arm64 – rkllm läuft nur auf RK3588 NPU
  # ──────────────────────────────────────────────
  build:
    needs: check
    if: >
      needs.check.outputs.needs_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU einrichten (für arm64-Build)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Login bei ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (arm64 only)
        uses: docker/build-push-action@v6
        with:
          context: ./rkllm
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/daywalker91/rkllm:latest
            ghcr.io/daywalker91/rkllm:${{ github.sha }}
          build-args: |
            RKLLM_VERSION=${{ needs.check.outputs.current_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version in GitHub Variable speichern
        run: |
          VERSION="${{ needs.check.outputs.current_version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/RKLLM_VERSION" \
            -d "{\"name\":\"RKLLM_VERSION\",\"value\":\"${VERSION}\"}")
          if [ "$STATUS" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
              -d "{\"name\":\"RKLLM_VERSION\",\"value\":\"${VERSION}\"}"
          else
            echo "Variable aktualisiert (HTTP $STATUS)"
          fi
