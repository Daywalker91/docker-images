name: Build whisper

on:
  push:
    paths:
      - 'whisper/**'
      - '.github/workflows/whisper.yml'
  schedule:
    - cron: '0 4 * * 1'   # wöchentlich montags 04:00 UTC
  workflow_dispatch:
    inputs:
      arm64_runner:
        description: 'Wo arm64 gebaut wird'
        type: choice
        default: auto
        options:
          - auto          # eigener RK3588-Runner, falls online – sonst GitHub
          - self-hosted   # erzwingen: eigener Runner
          - github        # erzwingen: GitHub-Runner (QEMU, langsam)

# Node.js 24 opt-in (Pflicht ab 02.06.2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: ghcr.io/daywalker91/whisper

# Sicherheit: Dieses Repo ist öffentlich und der eigene Runner läuft
# privilegiert mit Zugriff auf den containerd-Socket des Knotens.
# NIEMALS einen pull_request-Trigger hinzufügen – sonst könnten Forks
# Code auf dem Cluster ausführen.

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Basis-Images + whisper.cpp Version prüfen,
  #        und entscheiden, wo arm64 gebaut wird
  # ──────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      current_digest: ${{ steps.digest.outputs.digest }}
      current_whisper: ${{ steps.whisper.outputs.version }}
      arm64_self_hosted: ${{ steps.runner.outputs.self_hosted }}

    steps:
      - name: Digests der Basis-Images holen (debian:bookworm-slim + python:3.12-slim)
        id: digest
        run: |
          get_digest() {   # $1 = Repo, $2 = Tag
            TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/$1:pull" | jq -r .token)
            curl -sI -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://registry-1.docker.io/v2/library/$1/manifests/$2" \
              | grep -i "docker-content-digest" | awk '{print $2}' | tr -d '\r'
          }
          # Beide Stufen des Dockerfiles: Builder (debian) + Runtime (python)
          DIGEST="$(get_digest debian bookworm-slim)|$(get_digest python 3.12-slim)"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Aktuelle Digests: $DIGEST"

      - name: Neueste whisper.cpp Version holen (GitHub API)
        id: whisper
        run: |
          VERSION=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest \
            | jq -r .tag_name)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Aktuelle whisper.cpp Version: $VERSION"

      - name: Vergleich mit gespeicherten Werten
        id: compare
        run: |
          # Eigene Variable – PYTHON_SLIM_DIGEST gehört dem media-Workflow
          STORED_DIGEST="${{ vars.WHISPER_BASE_DIGEST }}"
          CURRENT_DIGEST="${{ steps.digest.outputs.digest }}"
          STORED_WHISPER="${{ vars.WHISPER_CPP_VERSION }}"
          CURRENT_WHISPER="${{ steps.whisper.outputs.version }}"

          echo "Basis-Images  gespeichert : $STORED_DIGEST"
          echo "Basis-Images  aktuell     : $CURRENT_DIGEST"
          echo "whisper.cpp   gespeichert : $STORED_WHISPER"
          echo "whisper.cpp   aktuell     : $CURRENT_WHISPER"

          if [ "$STORED_DIGEST" != "$CURRENT_DIGEST" ] || [ "$STORED_WHISPER" != "$CURRENT_WHISPER" ]; then
            echo "→ Update erkannt, Build wird gestartet"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "→ Kein Update, Build wird übersprungen"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Eigenen RK3588-Runner prüfen
        id: runner
        env:
          CHOICE: ${{ inputs.arm64_runner || 'auto' }}
        run: |
          # Ein offline Runner würde den Job 24 h in der Warteschlange
          # festhalten (timeout-minutes zählt die Wartezeit nicht mit) –
          # daher vorher fragen und notfalls auf GitHub ausweichen.
          if [ "$CHOICE" = "self-hosted" ]; then SELF=true
          elif [ "$CHOICE" = "github" ]; then SELF=false
          else
            ONLINE=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq '[.runners[]? | select(.status == "online") | select(any(.labels[]; .name == "rk3588"))] | length')
            if [ "${ONLINE:-0}" -gt 0 ]; then SELF=true; else SELF=false; fi
          fi
          echo "self_hosted=$SELF" >> $GITHUB_OUTPUT
          echo "arm64 wird gebaut auf: $([ "$SELF" = true ] && echo 'eigenem RK3588-Runner (nativ)' || echo 'GitHub-Runner (QEMU)')"

  # ──────────────────────────────────────────────
  # JOB 2a: amd64 auf GitHub (nativ)
  # ──────────────────────────────────────────────
  build-amd64:
    needs: check
    if: >
      needs.check.outputs.needs_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Login bei ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ./whisper
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest-amd64
          cache-from: type=gha,scope=whisper-amd64
          cache-to: type=gha,mode=max,scope=whisper-amd64

  # ──────────────────────────────────────────────
  # JOB 2b: arm64 – nativ auf dem eigenen RK3588-Runner,
  #         ist der offline: auf GitHub per QEMU
  # ──────────────────────────────────────────────
  build-arm64:
    needs: check
    if: >
      needs.check.outputs.needs_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.check.outputs.arm64_self_hosted == 'true' && fromJSON('["self-hosted","linux","arm64","rk3588"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── eigener Runner: nerdctl + BuildKit auf dem Knoten ──
      - name: Login bei ghcr.io (eigener Runner)
        if: needs.check.outputs.arm64_self_hosted == 'true'
        run: |
          echo "${{ secrets.GH_PAT }}" | \
          nerdctl --address /run/k3s/containerd/containerd.sock \
            login ghcr.io -u Daywalker91 --password-stdin

      - name: Build & Push (arm64, nativ)
        if: needs.check.outputs.arm64_self_hosted == 'true'
        run: |
          nerdctl --address /run/k3s/containerd/containerd.sock \
            build --platform linux/arm64 -t ${{ env.IMAGE }}:latest-arm64 ./whisper
          nerdctl --address /run/k3s/containerd/containerd.sock \
            push --platform linux/arm64 ${{ env.IMAGE }}:latest-arm64

      # ── Ausweichweg: GitHub-Runner mit QEMU ──
      - name: QEMU einrichten
        if: needs.check.outputs.arm64_self_hosted != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        if: needs.check.outputs.arm64_self_hosted != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login bei ghcr.io (GitHub-Runner)
        if: needs.check.outputs.arm64_self_hosted != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (arm64, QEMU)
        if: needs.check.outputs.arm64_self_hosted != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./whisper
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest-arm64
          cache-from: type=gha,scope=whisper-arm64
          cache-to: type=gha,mode=max,scope=whisper-arm64

  # ──────────────────────────────────────────────
  # JOB 3: Multiarch-Manifest zusammenführen + Variablen speichern
  # ──────────────────────────────────────────────
  merge:
    needs: [check, build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Login bei ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Multiarch-Manifest erstellen (latest + Commit-SHA)
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:latest-amd64 \
            ${{ env.IMAGE }}:latest-arm64
          docker buildx imagetools inspect ${{ env.IMAGE }}:latest

      - name: GitHub Variablen aktualisieren
        run: |
          update_or_create() {
            local NAME=$1
            local VALUE=$2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables/${NAME}" \
              -d "{\"name\":\"${NAME}\",\"value\":\"${VALUE}\"}")
            if [ "$STATUS" = "404" ]; then
              echo "${NAME} existiert noch nicht – wird erstellt..."
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
                -d "{\"name\":\"${NAME}\",\"value\":\"${VALUE}\"}"
            else
              echo "${NAME} aktualisiert (HTTP $STATUS)"
            fi
          }

          update_or_create "WHISPER_BASE_DIGEST" "${{ needs.check.outputs.current_digest }}"
          update_or_create "WHISPER_CPP_VERSION" "${{ needs.check.outputs.current_whisper }}"
