name: Build whisper

on:
  push:
    paths:
      - 'whisper/**'
      - '.github/workflows/whisper.yml'
      - '.github/workflows/build-multiarch.yml'
  schedule:
    - cron: '0 4 * * 1'   # wöchentlich montags 04:00 UTC
  workflow_dispatch:
    inputs:
      arm64_runner:
        description: 'Wo arm64 gebaut wird'
        type: choice
        default: auto
        options:
          - auto          # eigener RK3588-Runner, falls online – sonst GitHub
          - self-hosted   # erzwingen: eigener Runner
          - github        # erzwingen: GitHub-Runner (QEMU, langsam)

# Node.js 24 opt-in (Pflicht ab 02.06.2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Sicherheit: arm64 baut auf dem eigenen, privilegierten RK3588-Runner.
# NIEMALS einen pull_request-Trigger hinzufügen (öffentliches Repo).

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Basis-Images + whisper.cpp Version prüfen,
  #        und entscheiden, wo arm64 gebaut wird
  # ──────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      current_digest: ${{ steps.digest.outputs.digest }}
      current_whisper: ${{ steps.whisper.outputs.version }}

    steps:
      - name: Digests der Basis-Images holen (debian:bookworm-slim + python:3.12-slim)
        id: digest
        run: |
          get_digest() {   # $1 = Repo, $2 = Tag
            TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/$1:pull" | jq -r .token)
            curl -sI -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
              -H "Accept: application/vnd.oci.image.index.v1+json" \
              "https://registry-1.docker.io/v2/library/$1/manifests/$2" \
              | grep -i "docker-content-digest" | awk '{print $2}' | tr -d '\r'
          }
          # Beide Stufen des Dockerfiles: Builder (debian) + Runtime (python)
          DIGEST="$(get_digest debian bookworm-slim)|$(get_digest python 3.12-slim)"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Aktuelle Digests: $DIGEST"

      - name: Neueste whisper.cpp Version holen (GitHub API)
        id: whisper
        run: |
          VERSION=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest \
            | jq -r .tag_name)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Aktuelle whisper.cpp Version: $VERSION"

      - name: Vergleich mit gespeicherten Werten
        id: compare
        run: |
          # Eigene Variable – PYTHON_SLIM_DIGEST gehört dem media-Workflow
          STORED_DIGEST="${{ vars.WHISPER_BASE_DIGEST }}"
          CURRENT_DIGEST="${{ steps.digest.outputs.digest }}"
          STORED_WHISPER="${{ vars.WHISPER_CPP_VERSION }}"
          CURRENT_WHISPER="${{ steps.whisper.outputs.version }}"

          echo "Basis-Images  gespeichert : $STORED_DIGEST"
          echo "Basis-Images  aktuell     : $CURRENT_DIGEST"
          echo "whisper.cpp   gespeichert : $STORED_WHISPER"
          echo "whisper.cpp   aktuell     : $CURRENT_WHISPER"

          if [ "$STORED_DIGEST" != "$CURRENT_DIGEST" ] || [ "$STORED_WHISPER" != "$CURRENT_WHISPER" ]; then
            echo "→ Update erkannt, Build wird gestartet"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "→ Kein Update, Build wird übersprungen"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────
  # JOB 2: Multiarch-Image bauen (siehe build-multiarch.yml)
  #         Läuft wenn:
  #           - Basis/Version hat sich geändert (schedule)
  #           - Dateien wurden geändert (push)
  #           - Manuell ausgelöst (workflow_dispatch)
  # ──────────────────────────────────────────────
  build:
    needs: check
    if: >
      needs.check.outputs.needs_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-multiarch.yml
    with:
      image: ghcr.io/daywalker91/whisper
      context: ./whisper
      armv7: false
      arm64_runner: ${{ inputs.arm64_runner || 'auto' }}
    secrets: inherit

  # ──────────────────────────────────────────────
  # JOB 3: Gespeicherte Werte aktualisieren (erst nach erfolgreichem Build)
  # ──────────────────────────────────────────────
  variables:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Variablen aktualisieren
        run: |
          update_or_create() {
            local NAME=$1
            local VALUE=$2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables/${NAME}" \
              -d "{\"name\":\"${NAME}\",\"value\":\"${VALUE}\"}")
            if [ "$STATUS" = "404" ]; then
              echo "${NAME} existiert noch nicht – wird erstellt..."
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
                -d "{\"name\":\"${NAME}\",\"value\":\"${VALUE}\"}"
            else
              echo "${NAME} aktualisiert (HTTP $STATUS)"
            fi
          }

          update_or_create "WHISPER_BASE_DIGEST" "${{ needs.check.outputs.current_digest }}"
          update_or_create "WHISPER_CPP_VERSION" "${{ needs.check.outputs.current_whisper }}"

