name: Build whisper

on:
  push:
    paths:
      - 'whisper/**'
  schedule:
    - cron: '0 4 * * 1'   # wöchentlich montags 04:00 UTC
  workflow_dispatch:

# Node.js 24 opt-in (Pflicht ab 02.06.2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Basis-Image Digest + whisper.cpp Version prüfen
  # ──────────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      current_digest: ${{ steps.digest.outputs.digest }}
      current_whisper: ${{ steps.whisper.outputs.version }}

    steps:
      - name: Digest von Docker Hub holen (python:slim)
        id: digest
        run: |
          TOKEN=$(curl -s \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/python:pull" \
            | jq -r .token)

          DIGEST=$(curl -sI \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
            https://registry-1.docker.io/v2/library/python/manifests/slim \
            | grep -i "docker-content-digest" \
            | awk '{print $2}' \
            | tr -d '\r')

          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Aktueller Digest: $DIGEST"

      - name: Neueste whisper.cpp Version holen (GitHub API)
        id: whisper
        run: |
          VERSION=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ggerganov/whisper.cpp/releases/latest \
            | jq -r .tag_name)

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Aktuelle whisper.cpp Version: $VERSION"

      - name: Vergleich mit gespeicherten Werten
        id: compare
        run: |
          STORED_DIGEST="${{ vars.PYTHON_SLIM_DIGEST }}"
          CURRENT_DIGEST="${{ steps.digest.outputs.digest }}"
          STORED_WHISPER="${{ vars.WHISPER_CPP_VERSION }}"
          CURRENT_WHISPER="${{ steps.whisper.outputs.version }}"

          echo "python:slim    gespeichert : $STORED_DIGEST"
          echo "python:slim    aktuell     : $CURRENT_DIGEST"
          echo "whisper.cpp    gespeichert : $STORED_WHISPER"
          echo "whisper.cpp    aktuell     : $CURRENT_WHISPER"

          if [ "$STORED_DIGEST" != "$CURRENT_DIGEST" ] || [ "$STORED_WHISPER" != "$CURRENT_WHISPER" ]; then
            echo "→ Update erkannt, Build wird gestartet"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          else
            echo "→ Kein Update, Build wird übersprungen"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────
  # JOB 2: Multiarch-Image bauen und auf ghcr.io pushen
  #         Läuft wenn:
  #           - python:slim oder whisper.cpp hat sich geändert (schedule)
  #           - Datei in whisper/ wurde geändert (push)
  #           - Manuell ausgelöst (workflow_dispatch)
  # ──────────────────────────────────────────────
  build:
    needs: check
    if: >
      needs.check.outputs.needs_build == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU einrichten (für Multiarch-Build)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Login bei ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (amd64, arm64, arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: ./whisper
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/daywalker91/whisper:latest
            ghcr.io/daywalker91/whisper:${{ github.sha }}
          build-args: |
            WHISPER_VERSION=${{ needs.check.outputs.current_whisper }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Variablen aktualisieren
        run: |
          update_or_create() {
            local NAME=$1
            local VALUE=$2
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/variables/${NAME}" \
              -d "{\"name\":\"${NAME}\",\"value\":\"${VALUE}\"}")
            if [ "$STATUS" = "404" ]; then
              echo "${NAME} existiert noch nicht – wird erstellt..."
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/variables" \
                -d "{\"name\":\"${NAME}\",\"value\":\"${VALUE}\"}"
            else
              echo "${NAME} aktualisiert (HTTP $STATUS)"
            fi
          }

          update_or_create "PYTHON_SLIM_DIGEST" "${{ needs.check.outputs.current_digest }}"
          update_or_create "WHISPER_CPP_VERSION" "${{ needs.check.outputs.current_whisper }}"
